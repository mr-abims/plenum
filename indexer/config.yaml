# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Generated by scripts/config.mjs from contracts/deployments/10143.json. Do not edit by hand.
name: plenum-indexer
description: Plenum activity, manager actions, approvals, NAV and consent on Monad testnet
schema: ./schema.graphql
handlers: ./src/handlers
field_selection:
  transaction_fields:
    - hash

contracts:
  - name: PlenumFactory
    abi_file_path: ./abis/PlenumFactory.json
    events:
      - event: PlenumCreated
  - name: Plenum
    abi_file_path: ./abis/Plenum.json
    events:
      - event: MemberJoined
      - event: Contributed
      - event: Redeemed
      - event: ActionExecuted
      - event: ExitFeeCharged
      - event: MemberLeft
  - name: Mandate
    abi_file_path: ./abis/Mandate.json
    events:
      - event: MandateChangeScheduled
      - event: MandateChangeApplied
  - name: ManagerGateway
    abi_file_path: ./abis/ManagerGateway.json
    events:
      - event: ManagerAction
  - name: Governance
    abi_file_path: ./abis/Governance.json
    events:
      - event: Escalated
      - event: Approved
      - event: ProposalExecuted
      - event: Paused
      - event: Unpaused
      - event: ManagerReplaced
      - event: MandateChangeProposed
      - event: ManagerReplacementProposed
  - name: NavOracle
    abi_file_path: ./abis/NavOracle.json
    events:
      - event: NavReported
  - name: ConsentRegistry
    abi_file_path: ./abis/ConsentRegistry.json
    events:
      - event: ConsentGranted
      - event: ConsentRevoked

chains:
  - id: 10143
    start_block: 70007847
    hypersync_config:
      url: https://10143.hypersync.xyz
    rpc:
      - url: https://testnet-rpc.monad.xyz
        for: fallback
    contracts:
      # Every factory generation (SPEC A26 added the second); groups from both are indexed.
      - name: PlenumFactory
        address: ["0xA84fcA0D819E6d1004fa2F2071E51C0fc4408649", "0x5BC78c3784Fda7C15b6D586B9d21CA02De760E8D"]
      - name: NavOracle
        address: "0x925ce04252f13c24544009294E0C296D7C357cf4"
      - name: ConsentRegistry
        address: "0xE0F8572E251eC25A3C884278Fd2669163245c900"
      # Plenum, Mandate, ManagerGateway and Governance are per-group clones registered from PlenumCreated.
      - name: Plenum
      - name: Mandate
      - name: ManagerGateway
      - name: Governance
