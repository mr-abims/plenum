# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Generated by scripts/config.mjs from contracts/deployments/31337.json. Do not edit by hand.
name: plenum-indexer
description: Plenum activity, manager actions, approvals, refusals, NAV and consent on Monad testnet
schema: ./schema.graphql
handlers: ./src/handlers
field_selection:
  transaction_fields:
    - hash

contracts:
  - name: PlenumFactory
    abi_file_path: ../packages/abis/json/PlenumFactory.json
    events:
      - event: PlenumCreated
  - name: Plenum
    abi_file_path: ../packages/abis/json/Plenum.json
    events:
      - event: MemberJoined
      - event: Contributed
      - event: Redeemed
      - event: ComplianceRefused
      - event: ActionExecuted
  - name: ManagerGateway
    abi_file_path: ../packages/abis/json/ManagerGateway.json
    events:
      - event: ManagerAction
  - name: Governance
    abi_file_path: ../packages/abis/json/Governance.json
    events:
      - event: Escalated
      - event: Approved
      - event: ProposalExecuted
      - event: Paused
      - event: Unpaused
      - event: ManagerReplaced
  - name: NavOracle
    abi_file_path: ../packages/abis/json/NavOracle.json
    events:
      - event: NavReported
  - name: ConsentRegistry
    abi_file_path: ../packages/abis/json/ConsentRegistry.json
    events:
      - event: ConsentGranted
      - event: ConsentRevoked

chains:
  - id: 31337
    start_block: 0
    rpc:
      - url: http://127.0.0.1:8545
        for: sync
    contracts:
      - name: PlenumFactory
        address: "0xA51c1fc2f0D1a1b8494Ed1FE312d7C3a78Ed91C0"
      - name: NavOracle
        address: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      - name: ConsentRegistry
        address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      # Plenum, ManagerGateway and Governance are per-group clones registered from PlenumCreated.
      - name: Plenum
      - name: ManagerGateway
      - name: Governance
