# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Generated by scripts/config.mjs from contracts/deployments/10143.json. Do not edit by hand.
name: plenum-indexer
description: Plenum activity, manager actions, approvals, refusals, NAV and consent on Monad testnet
schema: ./schema.graphql
handlers: ./src/handlers
field_selection:
  transaction_fields:
    - hash

contracts:
  - name: PlenumFactory
    abi_file_path: ../packages/abis/json/PlenumFactory.json
    events:
      - event: PlenumCreated
  - name: Plenum
    abi_file_path: ../packages/abis/json/Plenum.json
    events:
      - event: MemberJoined
      - event: Contributed
      - event: Redeemed
      - event: ComplianceRefused
      - event: ActionExecuted
  - name: ManagerGateway
    abi_file_path: ../packages/abis/json/ManagerGateway.json
    events:
      - event: ManagerAction
  - name: Governance
    abi_file_path: ../packages/abis/json/Governance.json
    events:
      - event: Escalated
      - event: Approved
      - event: ProposalExecuted
      - event: Paused
      - event: Unpaused
      - event: ManagerReplaced
  - name: NavOracle
    abi_file_path: ../packages/abis/json/NavOracle.json
    events:
      - event: NavReported
  - name: ConsentRegistry
    abi_file_path: ../packages/abis/json/ConsentRegistry.json
    events:
      - event: ConsentGranted
      - event: ConsentRevoked

chains:
  - id: 10143
    start_block: 69734135
    hypersync_config:
      url: https://10143.hypersync.xyz
    rpc:
      - url: https://testnet-rpc.monad.xyz
        for: fallback
    contracts:
      - name: PlenumFactory
        address: "0xac8EB65C78cB34FdEb1E3e122e6aA6807419F5a4"
      - name: NavOracle
        address: "0xC45Fa55564BF4B53729c139D4613BfA295f3ad4a"
      - name: ConsentRegistry
        address: "0xa86c0d0fC110827c0ac40728D60e2987f4d5B1f2"
      # Plenum, ManagerGateway and Governance are per-group clones registered from PlenumCreated.
      - name: Plenum
      - name: ManagerGateway
      - name: Governance
