# SPEC §11 entities (plus A3). Amounts are settlement-asset base units (6 decimals, MOCK test dollars); units have 12 decimals.

type Plenum {
  id: ID! # plenum address
  name: String!
  templateId: Int!
  mandate: String!
  governance: String!
  gateway: String!
  createdAt: BigInt!
  memberCount: Int!
  totalUnits: BigInt!
  paused: Boolean!
  # SPEC A26: breaking fees kept by the group (shared pro-rata) and sent to the protocol treasury.
  feesToGroup: BigInt!
  feesToTreasury: BigInt!
  # When a rule change the members passed can apply; null when none is pending.
  pendingRuleChangeEta: BigInt
  members: [Member!]! @derivedFrom(field: "plenum")
  managerActions: [ManagerAction!]! @derivedFrom(field: "plenum")
  proposals: [Proposal!]! @derivedFrom(field: "plenum")
  navReports: [NavReport!]! @derivedFrom(field: "plenum")
  activity: [Activity!]! @derivedFrom(field: "plenum")
}

# Maps a per-group gateway or governance clone back to its plenum.
type ContractLink {
  id: ID! # clone address
  plenum_id: String!
  kind: String! # GATEWAY | GOVERNANCE | MANDATE
}

type Member {
  id: ID! # plenum-member
  plenum: Plenum!
  address: String!
  encPubKey: String!
  units: BigInt!
  contributed: BigInt!
  redeemed: BigInt!
  feesPaid: BigInt!
  active: Boolean! # false after the member left
  joinedAt: BigInt!
}

type ManagerAction {
  id: ID!
  plenum: Plenum!
  actionsHash: String!
  rationaleHash: String!
  modelId: String!
  reason: String!
  refused: Boolean!
  txHash: String!
  timestamp: BigInt!
}

type Proposal {
  id: ID! # governance-proposalId
  plenum: Plenum!
  proposalId: BigInt!
  kind: String! # ACTIONS | RULE_CHANGE | REPLACE_MANAGER
  newManager: String
  actionsHash: String! # keccak of the actions, the new config, or the new manager
  rationaleHash: String!
  approvals: Int!
  executed: Boolean!
  createdAt: BigInt!
  executedAt: BigInt
  approvalsList: [Approval!]! @derivedFrom(field: "proposal")
}

type Approval {
  id: ID!
  proposal: Proposal!
  member: String!
  timestamp: BigInt!
}

type NavReport {
  id: ID!
  plenum: Plenum!
  nav: BigInt!
  reportTimestamp: BigInt!
  source: String! # CRE | FALLBACK
  txHash: String!
}

type ConsentGrant {
  id: ID! # grant id
  member: String!
  grantee: String!
  scopeHash: String!
  expiry: BigInt!
  revoked: Boolean!
  grantedAt: BigInt!
}

# One row per member-facing event, newest first in the app's feed (RP-1).
type Activity {
  id: ID!
  plenum: Plenum!
  kind: String! # CONTRIBUTED | REDEEMED | JOINED | LEFT | EXIT_FEE | MANAGER_ACTION | ESCALATED | APPROVED | EXECUTED | PAUSED | UNPAUSED | NAV | ADAPTER | RULE_PROPOSED | RULE_SCHEDULED | RULE_APPLIED | MANAGER_PROPOSED | MANAGER_REPLACED
  actor: String!
  amount: BigInt
  detail: String!
  txHash: String!
  timestamp: BigInt!
}
