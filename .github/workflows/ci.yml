name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge fmt
        working-directory: contracts
        run: forge fmt --check

      - name: Forge build
        working-directory: contracts
        run: forge build --sizes

      - name: Forge test
        working-directory: contracts
        run: forge test -vvv

  agent:
    name: TypeScript (agent, crypto, indexer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry (anvil + forge for the red-team chain)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Indexer codegen
        run: pnpm --filter @plenum/indexer codegen

      - name: Typecheck
        run: pnpm --filter @plenum/agent typecheck && pnpm --filter @plenum/crypto typecheck && pnpm --filter @plenum/indexer typecheck

      - name: Data-room crypto tests
        run: pnpm --filter @plenum/crypto test

      - name: Unit tests
        run: pnpm --filter @plenum/agent test

      - name: Red-team suite (RT-1..RT-8)
        run: pnpm --filter @plenum/agent redteam
