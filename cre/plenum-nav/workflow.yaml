# CRE workflow settings (format from `cre init`, CLI v1.38).
staging-settings:
  user-workflow:
    workflow-name: "plenum-nav"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""
# Keeper runs (scripts/keeper.mjs): same workflow, a generated config listing the groups whose price is stale.
keeper-settings:
