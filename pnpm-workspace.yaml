packages:
  - contracts
  - agent
  - cre
  - indexer
  - app
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
minimumReleaseAgeExclude:
  - openai@7.30.0
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0
# @chainlink/cre-sdk's compiler scripts import `typescript` at runtime but only list it as a devDependency,
# so they would pick up the hoisted TypeScript 7 (no JS API). Pin the version the SDK is built against.
packageExtensions:
  '@chainlink/cre-sdk':
    dependencies:
      typescript: 5.9.3
